[project]
name = "microimage"
version = "0.1.0"
description = "Management of microscopy image analysis project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "nd2",
    "pylibczirw",
    "tifffile",
    "ome-types",
    "xarray",
    "ipykernel>=7.1.0",
    "ipywidgets>=8.1.8",
    "liffile",
    "imaris-ims-file-reader>=0.1.8",
    "slideio>=2.7.4",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.ruff]
select = ["E", "F", "W", "I", "D"]

[tool.ruff.pydocstyle]
convention = "numpy"

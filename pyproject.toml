[project]
name = "microimage"
version = "0.1.1"
description = "Management of microscopy image analysis project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "nd2",
    "pylibczirw",
    "tifffile",
    "ome-types",
    "ipykernel>=7.1.0",
    "ipywidgets>=8.1.8",
    "imaris-ims-file-reader>=0.1.8",
    "liffile",
    "slideio>=2.7.4",
    "scikit-image>=0.25.2",
    "matplotlib>=3.11.0",
    "xarray",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.ruff]
select = ["E", "F", "W", "I", "D"]

[tool.ruff.pydocstyle]
convention = "numpy"
